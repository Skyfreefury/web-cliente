<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <title>Inicio</title>
  </head>
  <body class="pagina-inicio">
    <nav class="navbar">
      <span class="navbar-marca">Ilerna Online</span>
      <div class="navbar-acciones">
        <button id="botonCarrito" class="boton-carrito" aria-label="Abrir carrito">
          <i class="bi bi-cart"></i>
          <span id="contadorCarrito">0</span>
        </button>
        <button id="botonCerrarSesion">Cerrar sesión</button>
      </div>
    </nav>

    <aside id="panelCarrito" class="panel-carrito oculto">
      <h2>Tu carrito</h2>
      <ul id="listaCarrito"></ul>
      <p class="total">Total: <span id="totalCarrito">0</span> €</p>
      <button id="botonVaciar">Vaciar carrito</button>
    </aside>

    <h1>Hola, <span id="nombreUsuario"></span></h1>
    <p>Has iniciado sesión correctamente.</p>

    <section id="listaProductos" class="productos"></section>

    <script type="module" src="/src/inicio.js"></script>
    <script type="module" src="/src/carrito.js"></script>
  </body>
</html>
