<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes</title>
  </head>
  <body>
    <!-- Spinner de carga: visible desde el principio, JS lo oculta al terminar -->
    <div id="spinner" class="spinner" role="status" aria-live="polite">
      <div class="spinner-anillos">
        <span class="anillo anillo-exterior"></span>
        <span class="anillo anillo-interior"></span>
        <span class="nucleo"></span>
      </div>
      <p class="spinner-texto">
        Cargando clientes<span class="puntos"><span>.</span><span>.</span><span>.</span></span>
      </p>
    </div>

    <h1>Clientes</h1>

    <p id="mensaje">Cargando clientes...</p>
    <button id="botonVista" class="switch" type="button" aria-pressed="false">
      <span class="switch-opcion">Tabla</span>
      <span class="switch-opcion">Cards</span>
    </button>
    <div id="vistaCards" class="oculto"></div>
    <table id="tablaClientes">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Dirección</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
